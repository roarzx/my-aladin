name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
        continue-on-error: true

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: unit tests（不依赖外部服务）
        run: go test ./... -count=1

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aladdin_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/aladdin_test?parseTime=true&loc=UTC
      TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/aladdin_test?parseTime=true&loc=UTC
      REDIS_ADDR: 127.0.0.1:6379
      TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 执行数据库迁移
        run: go run ./cmd/aladdin migrate
      - name: 集成测试
        run: go test -tags=integration ./... -count=1 -p 1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # hashFiles 在 job 级 if 中不可用，这里用脚本判断并写入 step output
      - name: 检查前端是否存在
        id: check
        run: |
          if [ -f web/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "web/ 尚未创建，跳过前端测试"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.exists == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 前端测试
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build
