server:
  http_addr: ":8080"
  ws_path: "/v1/acp"
  heartbeat_interval: 30s
  heartbeat_timeout: 90s

scheduler:
  max_active_steps_per_task: 1
  task_lock_ttl: 30s
  task_lock_renew: 10s
  attempt_lease_ttl: 60s
  recovery_scan_interval: 30s
  max_attempts_per_step: 3

context:
  tool_output_max_bytes: 32768
  reserve_output_tokens: 4096
  summary_only_when_dependency: true
  recent_n: 3
  recent_message_n: 5

storage:
  mysql_dsn: "${MYSQL_DSN}"
  redis_addr: "${REDIS_ADDR}"
  artifact_root: "./data/artifacts"

security:
  machine_token_ttl: 24h
  log_redaction: true
  admin_user_id: 1

daemon:
  # 本地默认；部署时可用 ALADDIN_ACP_URL / ALADDIN_API_URL 环境变量覆盖
  acp_url: "ws://127.0.0.1:8080/v1/acp"
  api_url: "http://127.0.0.1:8080"
  profile_dir: "~/.aladdin/profiles"

agent:
  claude:
    # 安装：npm i -g @agentclientprotocol/claude-agent-acp
    # 与 `claude-agent-acp --version` 保持一致
    bin: "claude-agent-acp"
    expected_version: "0.101.0"
    input_timeout_seconds: 1800
    # 受信任工作区自动批准工具体权限；生产环境请按安全策略开启
    auto_approve: true

acp:
  initialize_timeout: 3s
  max_message_bytes: 1048576
